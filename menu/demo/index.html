*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--wall);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:0 20px 48px}
header{padding:28px 0 10px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mark{display:flex;align-items:center;gap:10px;color:var(--sea)}
.mark svg{width:34px;height:34px}
.langs{display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--surface)}
.langs button{font:inherit;font-size:.85rem;font-weight:700;padding:7px 12px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--sea);color:var(--sea-ink)}
h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:clamp(2.4rem,10vw,3.4rem);line-height:1;margin:22px 0 6px;letter-spacing:-.5px}
.tagline{color:var(--muted);margin:0 0 18px}
.wave{display:block;width:100%;height:14px;color:var(--rule)}
.catch{position:relative;margin:22px 0 8px;background:var(--sea);color:var(--sea-ink);border-radius:18px;padding:20px 20px 18px;overflow:hidden}
.catch h2{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.5rem;margin:0 0 6px}
.catch p{margin:0;max-width:34ch;opacity:.9}
.catch .price{font-weight:700;margin-top:12px;display:inline-block;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:999px}
.catch svg{position:absolute;right:-6px;bottom:-4px;width:150px;height:auto;opacity:.22}
nav.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--wall);padding:10px 0;margin:10px -20px 0;padding-left:20px;padding-right:20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wall)}
nav.cats::-webkit-scrollbar{display:none}
nav.cats a{flex:none;text-decoration:none;color:var(--ink);background:var(--chip);padding:7px 14px;border-radius:999px;font-weight:600;font-size:.92rem}
section{padding-top:22px}
section h3{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.45rem;margin:0 0 8px}
.item{padding:12px 0;border-bottom:1px dashed var(--rule)}
.line{display:flex;align-items:baseline;gap:8px}
.name{font-weight:700}
.dots{flex:1;border-bottom:2px dotted var(--rule);transform:translateY(-4px);min-width:16px}
.price{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.desc{color:var(--muted);font-size:.93rem;margin:2px 0 0;max-width:52ch}
.tags{display:inline-flex;gap:4px;margin-left:6px;vertical-align:1px}
.t{font-size:.7rem;font-weight:700;border-radius:5px;padding:1px 5px;border:1px solid currentColor}
.t.v{color:var(--olive)} .t.gf{color:var(--oleander)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin-top:18px}
.info{margin-top:30px;display:grid;gap:12px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;background:var(--oleander);color:#fff;font-weight:700;padding:15px;border-radius:14px;font-size:1.05rem}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px 16px}
.box b{display:block;margin-bottom:2px}
.box a{color:var(--sea);font-weight:700}
:root[data-theme="dark"] .box a{color:#8cc4ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .box a{color:#8cc4ea}}
.allergen{color:var(--muted);font-size:.9rem;margin-top:16px}
.demo{margin-top:26px;text-align:center;color:var(--muted);font-size:.85rem}
.demo a{color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--oleander);outline-offset:2px}
</style>

function priceText(p){ return p ? "€ " + p.toFixed(2).replace(/\.00$/, "").replace(".", lang === "en" ? "." : ",") : DATA.ui[lang].ask; }

function render(){

  document.querySelectorAll("[data-ui]").forEach(el => { el.textContent = ui[el.dataset.ui]; });
